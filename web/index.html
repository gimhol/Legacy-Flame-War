<!doctype html>
<!-- WASM 宿主的步行骨架页面（DESIGN W13 第 1 步：clock + log + 帧控制）。
     这一刀**不画任何东西** —— 渲染命令缓冲是 W13 第 3 步（W5）。这个页面只是把
     「真正的 LFW 跑在 wasm 里、由 JS 推时钟、日志从 wasm 回到 JS」摆到屏幕上。

     起法（本环境没有浏览器，这段是给之后手测用的；同一批代码路径在 node 里已被
     `node native/web/smoke.mjs --bundle <dir>` 验过）：

       node native/web/build-wasm.mjs                       # 先编 wasm
       node native/web/make-bundle.mjs native/web/host-data # 再打数据包（默认 dist + host-data）
       # 静态服务仓库根目录，然后开 /native/web/index.html
       服务器要能拿到：
         /native/build/wasm/bin/lfw_wasm.mjs  + .wasm      （模块）
         /native/web/host-data/bundle.json    + bundle.bin （数据；prel 4.8MB，含 data 44MB） -->
<meta charset="utf-8" />
<title>LFW in WASM — walking skeleton</title>
<style>
  body { margin: 0; background: #111; color: #ddd; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  header { padding: 10px 14px; background: #1b1b1b; border-bottom: 1px solid #333; }
  b { color: #7fd1ff; } .warn { color: #ffb86c; } .err { color: #ff6b6b; } .dim { color: #888; }
  #hud { padding: 10px 14px; } #log { padding: 0 14px 24px; white-space: pre-wrap; }
</style>
<header>
  <b>LFW</b> (C++ 端口) 跑在 WASM 里 · JS 只给 <b>时钟</b> + <b>日志</b> ·
  <span class="warn">渲染/音频/图片/输入还没接（W13 顺序：clock → input → render → audio → images）</span>
</header>
<div id="hud">booting…</div>
<div id="log"></div>
<script type="module">
  import createLfwWasm from "../build/wasm/bin/lfw_wasm.mjs";
  import { createLfwHost, fetchBundle, bundleEntries } from "./host.mjs";

  const hud = document.getElementById("hud");
  const logEl = document.getElementById("log");
  const say = (cls, text) => {
    const d = document.createElement("div");
    if (cls) d.className = cls;
    d.textContent = text;
    logEl.appendChild(d);
    while (logEl.childElementCount > 200) logEl.removeChild(logEl.firstChild);
  };

  const host = await createLfwHost({
    moduleFactory: createLfwWasm,
    live: true, // 三个槽真的接到 JS：时钟 = performance.now()，定时 = 虚拟队列，raf = 每帧
    clock: () => performance.now(),
    onLog: (level, text) => say(level >= 3 ? "err" : level === 2 ? "warn" : "", text),
  });

  try {
    const { index, binBytes } = await fetchBundle("./host-data/bundle.json", "./host-data/bundle.bin");
    host.install(bundleEntries(index, binBytes, "/"));
    host.create();
    // 按顺序挂包（先 prel 后 data，与 `lfw_run --zip` 的顺序同义）
    for (const root of index.roots) if (root !== "builtin_data") host.addZip(`/${root}`);
    host.load();
    host.boot({ stage: "1", fighterA: index.roots.includes("data") ? "1" : "", fighterB: "4", players: 2 });
    say("dim", `[page] loaded: ${JSON.stringify(host.dataCounts())}`);
  } catch (e) {
    hud.innerHTML = `<span class="err">启动失败：${e.message}</span>（先跑 make-bundle.mjs，见 index.html 顶部注释）`;
    throw e;
  }

  let last = performance.now();
  let frames = 0;
  function tick(t) {
    // 浏览器稳态（W8）：这个 raf 回调**不调** `lfw_frame` —— 世界由端口自己的
    // `Ticker` 推（`LFW` ctor 里 `world.start_update()`），它经由 JS 的时钟/定时槽唤醒。
    host.pump();
    frames++;
    if (t - last > 250) {
      const s = host.stats();
      hud.textContent =
        `page fps≈${(frames / ((t - last) / 1000)).toFixed(0)} · wasm frames(explicit)=${s.frames} ` +
        `lifetime=${s.lifetime} entities=${s.entities} ghosts=${s.ghosts} hp=${s.totalHp} ` +
        `warns=${s.warns} errors=${s.errors} · clock(wasm)=${host.clockNowSeenByWasm().toFixed(0)}ms ` +
        `· digest=${host.digest()}`;
      last = t;
      frames = 0;
    }
    requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
</script>
